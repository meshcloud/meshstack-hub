sonar.projectKey=meshcloud_meshstack-hub
sonar.organization=meshcloud

sonar.sources=.
sonar.tests=.
sonar.exclusions=**/*.spec.ts,**/*.test.mjs,**/*_test.go,**/*.png,**/*.ico
sonar.test.inclusions=**/*.spec.ts,**/*.test.mjs,**/*_test.go

# The scorecard and tofu validate cover the Terraform modules.
sonar.terraform.activate=false

# Every building block module is self-contained, so both connectors ship the same script.
sonar.cpd.exclusions=**/github-connector/buildingblock/dispatch_github_workflow.py

sonar.issue.ignore.multicriteria=cc_js,cc_ts,cc_go,cc_py,str_js,str_ts,str_go,str_py,str_sh,str_gha,str_azp

sonar.issue.ignore.multicriteria.cc_js.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.cc_js.resourceKey=**/*
sonar.issue.ignore.multicriteria.cc_ts.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.cc_ts.resourceKey=**/*
sonar.issue.ignore.multicriteria.cc_go.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.cc_go.resourceKey=**/*
sonar.issue.ignore.multicriteria.cc_py.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.cc_py.resourceKey=**/*

sonar.issue.ignore.multicriteria.str_js.ruleKey=javascript:S1192
sonar.issue.ignore.multicriteria.str_js.resourceKey=**/*
sonar.issue.ignore.multicriteria.str_ts.ruleKey=typescript:S1192
sonar.issue.ignore.multicriteria.str_ts.resourceKey=**/*
sonar.issue.ignore.multicriteria.str_go.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.str_go.resourceKey=**/*
sonar.issue.ignore.multicriteria.str_py.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.str_py.resourceKey=**/*
sonar.issue.ignore.multicriteria.str_sh.ruleKey=shell:S1192
sonar.issue.ignore.multicriteria.str_sh.resourceKey=**/*
sonar.issue.ignore.multicriteria.str_gha.ruleKey=githubactions:S1192
sonar.issue.ignore.multicriteria.str_gha.resourceKey=**/*
sonar.issue.ignore.multicriteria.str_azp.ruleKey=azurepipelines:S1192
sonar.issue.ignore.multicriteria.str_azp.resourceKey=**/*
