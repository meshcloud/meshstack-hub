{{- if .Values.wildcardCertificate.enabled }}
# One certificate covers every hostname in the zone. It lives in the HAProxy namespace, which
# outlives any application namespace, so tearing an application down never takes the certificate
# with it. HAProxy serves the resulting secret as its default TLS certificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.wildcardCertificate.name }}
  namespace: {{ .Values.wildcardCertificate.namespace }}
spec:
  secretName: {{ .Values.wildcardCertificate.secretName }}
  dnsNames:
    - {{ printf "*.%s" .Values.dns01.zoneName | quote }}
  issuerRef:
    name: {{ .Values.clusterIssuer.name }}
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
