apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name }}
spec:
  acme:
    email: {{ .Values.clusterIssuer.email | quote }}
    server: {{ .Values.clusterIssuer.server | quote }}
    privateKeySecretRef:
      name: {{ .Values.clusterIssuer.privateKeySecretName }}
    solvers:
      {{- with .Values.dns01 }}
      - dns01:
          {{- toYaml .solver | nindent 10 }}
        selector:
          dnsZones:
            - {{ .domain | quote }}
      {{- end }}
      - http01:
          ingress:
            ingressClassName: {{ .Values.ingressClassName }}
