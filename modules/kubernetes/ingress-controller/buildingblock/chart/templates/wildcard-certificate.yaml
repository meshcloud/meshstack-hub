{{- with .Values.wildcardCerts }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-tls
  namespace: {{ .namespace }}
spec:
  secretName: wildcard-tls
  dnsNames:
    - {{ printf "*.%s" .domain | quote }}
  issuerRef:
    name: {{ $.Values.clusterIssuer.name }}
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
