# Run tasks inside `nix develop`, which provides node, git and task.
version: '3'

vars:
  BASE_REF: origin/main

tasks:
  diagrams:
    desc: Render every *.dot diagram to a sibling *.svg
    cmds:
      - node tools/diagrams/render-diagrams.mjs {{.CLI_ARGS}}

  diagrams:check:
    desc: Fail if any committed diagram SVG is stale or missing
    cmds:
      - node tools/diagrams/render-diagrams.mjs --check

  scorecard:pr:
    desc: "Run the scorecard on modules changed vs BASE_REF (default: origin/main), or with the scorecard arguments given after --. Usage: task scorecard:pr, task scorecard:pr BASE_REF=origin/my-branch, task scorecard:pr -- --module=aws/budget-alert"
    cmds:
      - node tools/scorecard/scorecard.mjs {{.CLI_ARGS | default (print "--changed-since=" .BASE_REF)}}
