# Run tasks inside `nix develop`, which provides node, git and task.
version: '3'

vars:
  BASE_REF: origin/main

tasks:
  diagrams:
    desc: Render every *.dot diagram to a sibling *.svg
    cmds:
      - node tools/diagrams/render-diagrams.mjs {{.CLI_ARGS}}

  diagrams:check:
    desc: Fail if any committed diagram SVG is stale or missing
    cmds:
      - node tools/diagrams/render-diagrams.mjs --check

  scorecard:pr:
    desc: "Run the scorecard on modules and reference architectures changed vs BASE_REF (default: origin/main), or with the scorecard arguments given after --. Usage: task scorecard:pr, task scorecard:pr BASE_REF=origin/my-branch, task scorecard:pr -- --module=aws/budget-alert, task scorecard:pr -- --ref-archs"
    cmds:
      - node tools/scorecard/scorecard.mjs {{.CLI_ARGS | default (print "--changed-since=" .BASE_REF)}}

  docs:
    desc: Regenerate the terraform-docs sections of module READMEs. CI does this on main after a merge, so this is only a local preview.
    cmds:
      - ci/terraform_docs.sh

  lint:
    desc: Run shellcheck, ruff, ty and actionlint on the tracked shell scripts, python scripts and workflows. CI also runs zizmor on the workflows.
    vars:
      OUTPUT_FORMAT: '{{if eq .GITHUB_ACTIONS "true"}}github{{else}}full{{end}}'
      SHELL_SCRIPTS:
        sh: >-
          git ls-files | while read -r file; do [ -f "$file" ] && printf '%s\n' "$file"; done |
          xargs -d '\n' awk 'FNR == 1 { if (FILENAME ~ /\.(sh|bash)$/ || /^#!.*(bash|\/sh$|env sh)/) print FILENAME; nextfile }'
      PYTHON_SCRIPTS:
        sh: >-
          git ls-files | while read -r file; do [ -f "$file" ] && printf '%s\n' "$file"; done |
          xargs -d '\n' awk 'FNR == 1 { if (FILENAME ~ /\.py$/ || /^#!.*python/) print FILENAME; nextfile }'
    cmds:
      - shellcheck {{.SHELL_SCRIPTS | catLines}}
      - actionlint
      - ruff check --output-format {{.OUTPUT_FORMAT}} {{.PYTHON_SCRIPTS | catLines}}
      - ruff format --check {{.PYTHON_SCRIPTS | catLines}}
      - ty check --output-format {{.OUTPUT_FORMAT}} {{.PYTHON_SCRIPTS | catLines}}
