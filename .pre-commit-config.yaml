repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
        exclude: ^tools/render-meshstack-integration-tf/templates/provider
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0 # Use the ref you want to point at
    hooks:
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: validate-modules
        name: Validate modules
        entry: sh -c 'bash ci/validate_modules.sh --fix'
        language: system
        pass_filenames: true
        always_run: true
