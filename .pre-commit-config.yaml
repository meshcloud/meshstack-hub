repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_docs
        args:
          - --args=--config=.terraform-docs.yml
        # Only run terraform_docs on .tf files inside 'backplane' or 'buildingblock' folders
        files: ^modules/[^/]+/[^/]+/(backplane|buildingblock)/.+\.tf$
        # terraform-docs cannot parse a variable inside a module `source`, which this
        # building block needs to keep the shared module in lockstep with its own git ref.
        # https://github.com/terraform-docs/terraform-docs/issues/793
        exclude: ^modules/ske/forgejo-connector/buildingblock/
      - id: terraform_fmt
        exclude: ^tools/render-meshstack-integration-tf/templates/provider
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0 # Use the ref you want to point at
    hooks:
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: validate-tf-config
        name: Validate Terraform configuration
        entry: bash ci/validate_tf_config.sh
        language: system
        files: \.tf$
        # The renderer's templates and testdata are deliberately not loadable
        # configurations - they are inputs to a Go tool, not modules.
        exclude: ^tools/render-meshstack-integration-tf/(templates|testdata)/
      - id: validate-modules
        name: Validate modules
        entry: sh -c 'bash ci/validate_modules.sh --fix'
        language: system
        pass_filenames: true
        always_run: true
