name: terraform-docs

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: terraform-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  regenerate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#github_actions --command bash -euo pipefail {0}
    environment: main
    permissions:
      contents: read
    steps:
      # The deploy key may push to main past the branch ruleset. Its own push starts this
      # workflow again, which then finds nothing to regenerate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: main
          ssh-key: ${{ secrets.REPO_DEPLOY_KEY }}

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_on_tmpfs: true

      - name: Regenerate and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            ci/terraform_docs.sh
            if git diff --quiet; then
              echo "READMEs are up to date"
              exit 0
            fi
            git --no-pager diff --stat
            git commit -am "docs: regenerate terraform-docs"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected on attempt $attempt, retrying on the new main"
            sleep $((attempt * 5))
          done
          exit 1

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#github_actions --command bash -euo pipefail {0}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_on_tmpfs: true

      - name: Regenerate
        run: |
          ci/terraform_docs.sh
          git --no-pager diff --stat > "$RUNNER_TEMP/terraform-docs.stat"
          git --no-pager diff > "$RUNNER_TEMP/terraform-docs.diff"

      - name: Post, update or delete PR comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/terraform_docs_pr_comment.py "$RUNNER_TEMP/terraform-docs.stat" "$RUNNER_TEMP/terraform-docs.diff"
