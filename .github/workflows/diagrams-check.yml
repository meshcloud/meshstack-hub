name: Diagrams Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**.dot"
      - "**.svg"
      - "tools/diagrams/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/diagrams-check.yml"

concurrency:
  group: diagrams-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify committed SVGs match their .dot sources
        run: node tools/diagrams/render-diagrams.mjs --check
